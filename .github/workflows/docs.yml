name: Docs

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: oracledesk-stellar

jobs:
  build:
    name: Build mdBook, rustdoc, TypeDoc, and verify contract references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5907c079ce0327 # master

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.7.8
        with:
          workspaces: "oracledesk-stellar -> target"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Run contract reference generator tests
        run: node --test scripts/gen-contract-docs/generate.test.mjs

      - name: Regenerate contract reference pages and verify no drift
        run: |
          node scripts/gen-contract-docs/generate.mjs
          git diff --exit-code -- docs/reference

      - name: Install pinned mdBook binary
        env:
          MDBOOK_VERSION: 0.4.48
          MDBOOK_SHA256: 0b0f6b9a5b69f7b1f3b4a17e770c96f8f3b26a67477a86b3a3a08b7e883d398e
        run: |
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/mdbook.tar.gz
          mkdir -p "$RUNNER_TEMP/mdbook"
          tar -xzf /tmp/mdbook.tar.gz -C "$RUNNER_TEMP/mdbook" mdbook
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"

      - name: Build mdBook site
        run: mdbook build docs

      - name: Build rustdoc for core contracts
        run: |
          cargo doc --no-deps -p market-core -p resolver -p treasury -p reasoning-registry
          mkdir -p docs/book/rustdoc
          cp -r target/doc/* docs/book/rustdoc/

      - name: Build TypeDoc for TypeScript packages
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build -w packages/bindings --if-present
          npx --yes typedoc --options typedoc.json

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: oracledesk-stellar/docs/book

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

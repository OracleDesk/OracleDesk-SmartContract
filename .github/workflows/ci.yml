name: CI

on:
  push:
    branches: [develop, main]
    paths: ["oracledesk-stellar/**", ".github/workflows/ci.yml"]
  pull_request:
    branches: [develop, main]
    paths: ["oracledesk-stellar/**", ".github/workflows/ci.yml"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: oracledesk-stellar

env:
  CARGO_TERM_COLOR: always

jobs:
  toolchain-sync:
    name: Toolchain sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify toolchain.env matches rust-toolchain.toml, Dockerfile, and flake.nix
        run: |
          ./scripts/check-toolchain-sync.sh
          node --test scripts/toolchain.test.mjs
      - name: Install Rust (needed for cargo metadata in lockfile check)
        uses: dtolnay/rust-toolchain@stable
      - name: Verify all Cargo.lock files are committed and up to date
        run: ./scripts/check-lockfiles.sh

  rust:
    name: Rust (fmt, clippy, test, wasm build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read pinned toolchain versions
        id: pinned
        run: |
          echo "rust=$(grep '^channel' oracledesk-stellar/rust-toolchain.toml | sed 's/.*= *"\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"
          echo "stellar=$(cat oracledesk-stellar/stellar-cli.version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pinned.outputs.rust }}
          targets: wasm32v1-none
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "oracledesk-stellar -> target"

      # Installed the same way this repo's contributors install it locally
      # (`cargo install stellar-cli` — verified against the actual crate
      # name behind the `stellar` binary, not a guessed GitHub Action).
      - name: Install stellar CLI
        run: cargo install --locked stellar-cli --version ${{ steps.pinned.outputs.stellar }}

      - name: cargo fmt --check
        run: |
          cargo fmt --check
          cargo fmt --manifest-path scripts/interface-manifest/Cargo.toml --check

      - name: cargo clippy
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          CARGO_TARGET_DIR=target cargo clippy --locked --manifest-path scripts/interface-manifest/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked --workspace

      - name: Build all contracts to wasm
        run: |
          stellar contract build
          cp target/wasm32v1-none/release/market_core.wasm contracts/resolver/market_core.wasm
          cp target/wasm32v1-none/release/market_core.wasm contracts/treasury/market_core.wasm
          cp target/wasm32v1-none/release/reasoning_registry.wasm contracts/resolver/reasoning_registry.wasm
          cp target/wasm32v1-none/release/market_core.wasm contracts/router/market_core.wasm
          cp target/wasm32v1-none/release/resolver.wasm contracts/router/resolver.wasm
          cp target/wasm32v1-none/release/reasoning_registry.wasm contracts/router/reasoning_registry.wasm
          cp target/wasm32v1-none/release/resolver.wasm contracts/treasury/resolver.wasm
          stellar contract build

      - name: Fail if vendored wasm drifted from the build
        run: |
          git diff --exit-code -- \
            contracts/resolver/market_core.wasm \
            contracts/treasury/market_core.wasm \
            contracts/treasury/resolver.wasm \
            contracts/resolver/reasoning_registry.wasm \
            contracts/router/market_core.wasm \
            contracts/router/resolver.wasm \
            contracts/router/reasoning_registry.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: oracledesk-stellar/target/wasm32v1-none/release/*.wasm

  python-model:
    name: Python FPMM model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 model/fpmm_model.py

  node:
    name: Node (x402, agents)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: contract-wasm
          path: oracledesk-stellar/target/wasm32v1-none/release

      - name: Read pinned toolchain versions
        id: pinned-node
        run: |
          echo "rust=$(grep '^channel' oracledesk-stellar/rust-toolchain.toml | sed 's/.*= *"\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"
          echo "stellar=$(cat oracledesk-stellar/stellar-cli.version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pinned-node.outputs.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "oracledesk-stellar -> target"
      - name: Install Stellar CLI
        run: |
          STELLAR_VER="${{ steps.pinned-node.outputs.stellar }}"
          curl -fsSL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_VER}/stellar-cli-${STELLAR_VER}-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/stellar.tar.gz
          mkdir -p "$RUNNER_TEMP/stellar-bin"
          tar -xzf /tmp/stellar.tar.gz -C "$RUNNER_TEMP/stellar-bin" stellar
          echo "$RUNNER_TEMP/stellar-bin" >> "$GITHUB_PATH"

      - name: Generate bindings from the built wasm
        run: |
          chmod +x scripts/gen-bindings.sh
          ./scripts/gen-bindings.sh

      - name: Check interface compatibility and versions
        env:
          INTERFACE_BASE_REF: origin/${{ github.base_ref || 'develop' }}
        run: make interface-check

      - name: Fail if committed bindings are stale
        run: git diff --exit-code -- packages/bindings

      - name: Install and build bindings packages
        run: |
          for pkg in market-core resolver treasury reasoning-registry timelock router test-oracle; do
            (cd "packages/bindings/$pkg" && npm install && npm run build)
          done

      - name: Interface tool tests
        run: CARGO_TARGET_DIR=target cargo test --locked --manifest-path scripts/interface-manifest/Cargo.toml

      - name: x402 — install, typecheck, test
        run: |
          cd x402
          npm ci
          npm run build
          npm test

      - name: agents — install, typecheck, test
        run: |
          cd agents
          npm install
          npm run build
          npm test

      # Fake-RPC fault injection against the real live adapter (#106). Uses
      # the wasm downloaded above when it fits the adapter, else the vendored
      # copies; deterministic (seeded faults, fake ledger clock), no network.
      - name: agents — chaos tests
        run: |
          cd agents
          npm run test:chaos

  scripts:
    name: Shell scripts (bats, shellcheck, shfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned shellcheck and shfmt
        run: |
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz -o /tmp/sc.tar.xz
          tar -xJf /tmp/sc.tar.xz -C /tmp
          sudo mv /tmp/shellcheck-v0.10.0/shellcheck /usr/local/bin/shellcheck
          curl -fsSL https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64 -o /tmp/shfmt
          chmod +x /tmp/shfmt
          sudo mv /tmp/shfmt /usr/local/bin/shfmt
      - name: ShellCheck
        run: shellcheck scripts/deploy-testnet.sh scripts/seed-market.sh scripts/demo.sh scripts/gen-bindings.sh scripts/create-issues.sh scripts/check-lockfiles.sh scripts/test/stubs/*
      - name: shfmt
        run: shfmt -i 2 -ci -d scripts/deploy-testnet.sh scripts/seed-market.sh scripts/demo.sh scripts/gen-bindings.sh scripts/create-issues.sh scripts/check-lockfiles.sh scripts/test/stubs/*
      - name: Run bats script tests
        run: make test-scripts

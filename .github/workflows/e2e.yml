name: Local E2E

on:
  push:
    branches: [develop, main]
    paths:
      - "oracledesk-stellar/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "oracledesk-stellar/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local:
    name: quickstart end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: oracledesk-stellar
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5907c079ce0327 # master
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.8
        with:
          workspaces: oracledesk-stellar

      - uses: stellar/stellar-cli@v27.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            oracledesk-stellar/package-lock.json
            oracledesk-stellar/agents/package-lock.json
            oracledesk-stellar/x402/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install jq and curl
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Build contracts and bindings
        run: |
          make setup
          make build

      - name: Run hermetic E2E harness
        env:
          # Pin the quickstart image in CI. `testing` tracks the current
          # protocol; record the digest from the job log when bumping it.
          QUICKSTART_IMAGE: stellar/quickstart:testing
        run: ./scripts/e2e-local.sh

      - name: Run nightly heavy E2E stages
        if: github.event_name == 'schedule'
        env:
          QUICKSTART_IMAGE: stellar/quickstart:testing
        run: ./scripts/e2e-local.sh --stages core,vault,settle,batch,finalize,timelock,router,signers-disputable

      - name: Upload deployment + trace artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: local-e2e-artifacts
          path: |
            oracledesk-stellar/deployments/local.json
            oracledesk-stellar/deployments/traces-local/
            oracledesk-stellar/deployments/e2e-report.json
            oracledesk-stellar/deployments/e2e-artifacts/
          if-no-files-found: ignore

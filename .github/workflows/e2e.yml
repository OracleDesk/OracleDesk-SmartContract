name: Local E2E

on:
  push:
    branches: [develop, main]
    paths:
      - "oracledesk-stellar/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "oracledesk-stellar/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local:
    name: quickstart end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: oracledesk-stellar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5907c079ce0327 # master
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.7.8
        with:
          workspaces: oracledesk-stellar

      - uses: stellar/stellar-cli@v30.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            oracledesk-stellar/package-lock.json
            oracledesk-stellar/agents/package-lock.json
            oracledesk-stellar/x402/package-lock.json

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install jq and curl
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Build contracts and bindings
        run: |
          make setup
          make build

      - name: Run hermetic E2E harness
        env:
          # Pin the quickstart image in CI. `testing` tracks the current
          # protocol; record the digest from the job log when bumping it.
          QUICKSTART_IMAGE: stellar/quickstart:testing
        run: ./scripts/e2e-local.sh

      - name: Upload deployment + trace artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-e2e-artifacts
          path: |
            oracledesk-stellar/deployments/local.json
            oracledesk-stellar/deployments/traces-local/
          if-no-files-found: ignore

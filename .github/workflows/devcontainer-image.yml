name: Devcontainer Image & Toolchain Sync

on:
  push:
    branches: [develop]
    paths:
      - '.devcontainer/**'
      - 'oracledesk-stellar/toolchain.env'
      - 'oracledesk-stellar/rust-toolchain.toml'
      - 'oracledesk-stellar/stellar-cli.version'
      - 'flake.nix'
  pull_request:
    paths:
      - '.devcontainer/**'
      - 'oracledesk-stellar/toolchain.env'
      - 'oracledesk-stellar/rust-toolchain.toml'
      - 'oracledesk-stellar/stellar-cli.version'
      - 'flake.nix'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  toolchain-sync:
    name: Verify toolchain.env sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check toolchain synchronization
        run: bash oracledesk-stellar/scripts/check-toolchain-sync.sh
      - name: Run Node toolchain sync tests
        run: node --test oracledesk-stellar/scripts/toolchain.test.mjs

  build-devcontainer:
    name: Build pinned devcontainer image
    needs: [toolchain-sync]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute toolchain hash tag
        id: tag
        run: |
          hash="$(sha256sum oracledesk-stellar/toolchain.env .devcontainer/Dockerfile | sha256sum | cut -c1-12)"
          echo "hash=${hash}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR on develop push
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on develop) devcontainer image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
          tags: |
            ghcr.io/oracledesk/oracledesk-dev:${{ steps.tag.outputs.hash }}
            ghcr.io/oracledesk/oracledesk-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

[package]
name = "resolver"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
# Shared #[contracttype] definitions (Outcome/Category and the resolution
# spec surface). Types-only crate: no #[contract]/#[contractimpl], so it
# cannot reintroduce the __constructor collision (ADR 0002).
oracledesk-types = { path = "../oracledesk-types" }
# experimental_spec_shaking_v2 re-exports types pulled in via contractimport!
# (Outcome, Category) into this contract's own spec, so generated TS bindings
# see them instead of an opaque/missing type. See docs/adr/0002-cross-contract-calls.md.
soroban-sdk = { version = "27.0.6", features = ["experimental_spec_shaking_v2"] }

[dev-dependencies]
ed25519-dalek = "2"
soroban-sdk = { version = "27.0.6", features = ["testutils", "experimental_spec_shaking_v2"] }
# A native registration of market-core in tests, so `cargo llvm-cov` sees its
# code (the wasm copy runs in the VM, which produces no host coverage).
# Renamed: this crate already has a `market_core` module from `contractimport!`.
market-core-native = { package = "market-core", path = "../market-core" }

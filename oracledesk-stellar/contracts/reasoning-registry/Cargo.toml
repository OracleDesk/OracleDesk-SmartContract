[package]
name = "reasoning-registry"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

# Issue #18 (completion): one opt-in feature, nothing else in this file.
# `test-v2` compiles this crate as the build whose schema is already 2
# (`SCHEMA_VERSION`, the 1 -> 2 step in `migrate_from`, the `TraceV2`
# projection) and turns on the cross-version tests. The default build must
# not enable it: its storage layout and its entrypoint set are what the
# vendored `market_core.wasm` copy this crate `contractimport!`s is compiled
# against (docs/adr/0002-cross-contract-calls.md).
[features]
test-v2 = []

[dependencies]
soroban-sdk = { version = "27.0.6", features = ["experimental_spec_shaking_v2"] }

[dev-dependencies]
ed25519-dalek = "2"
soroban-sdk = { version = "27.0.6", features = ["testutils", "experimental_spec_shaking_v2"] }

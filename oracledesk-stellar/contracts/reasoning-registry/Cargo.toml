[package]
name = "reasoning-registry"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
# Shared storage-TTL policy (issue #371); types-only crate, so it cannot
# reintroduce the __constructor collision (ADR 0002).
oracledesk-types = { path = "../oracledesk-types" }
soroban-sdk = { version = "=27.0.6", features = ["experimental_spec_shaking_v2"] }

[dev-dependencies]
ed25519-dalek = "2"
soroban-sdk = { version = "=27.0.6", features = ["testutils", "experimental_spec_shaking_v2"] }
# Native registrations replace the removed vendored market_core.wasm (#322);
# renamed so the test shim module can keep the `market_core` name.
market-core-native = { package = "market-core", path = "../market-core" }
resolver = { path = "../resolver" }

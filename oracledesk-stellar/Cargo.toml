[workspace]
members = [
    "contracts/oracledesk-types",
    "contracts/market-core",
    "contracts/resolver",
    "contracts/reasoning-registry",
    "contracts/treasury",
    "contracts/timelock",
    "contracts/router",
    "contracts/integration-tests",
]
resolver = "2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

# The Soroban host dominates test time; optimise dependencies (not the
# workspace's own crates) so contract-heavy tests such as
# contracts/integration-tests finish in seconds instead of minutes.
[profile.dev.package."*"]
opt-level = 3

name: Scout Static Analysis

on:
  pull_request:
    paths:
      - "oracledesk-stellar/contracts/**"
      - "oracledesk-stellar/Cargo.*"
      - ".github/workflows/scout.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "oracledesk-stellar/contracts/**"
      - "oracledesk-stellar/Cargo.*"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scout:
    name: Scout Audit
    runs-on: ubuntu-latest

    env:
      RUST_TOOLCHAIN: stable
      SCOUT_TOOLCHAIN: nightly-2025-11-18

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Scout prerequisites
        run: |
          cargo install --locked cargo-scout-audit
          cargo install --locked cargo-expand

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "oracledesk-stellar"

      - name: Cache dylint drivers
        uses: actions/cache@v3
        with:
          path: ~/.dylint_drivers
          key: ${{ runner.os }}-dylint-${{ env.SCOUT_TOOLCHAIN }}
          restore-keys: |
            ${{ runner.os }}-dylint-

      - name: Run Scout audit
        working-directory: oracledesk-stellar
        run: |
          cargo scout-audit --output-format sarif --output-path ../scout.sarif
        continue-on-error: true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: scout.sarif
          category: scout-soroban

      - name: Validate against suppression list
        working-directory: oracledesk-stellar
        run: |
          # This step validates that all findings are either fixed or documented
          # in docs/static-analysis.md with explicit suppressions
          if ! grep -q "^## Suppression List" docs/static-analysis.md; then
            echo "ERROR: docs/static-analysis.md missing suppression list"
            exit 1
          fi
          echo "✓ Suppression list found in documentation"

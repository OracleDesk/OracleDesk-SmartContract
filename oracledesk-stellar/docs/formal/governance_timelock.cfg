\* Timelock safety with honest roles: eta, expiry, cancellation and the
\* emergency allow-list all hold (exit 0). Actors exclude the admin key k3.
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoExecuteBeforeEta
    NoExecuteAfterExpiry
    CancelWinsBeforeExecute
    EmergencyAllowListOnly
CONSTANTS
    Keys = {k1, k2, k3}
    K1 = k1
    K2 = k2
    K3 = k3
    Core = core
    Res = resolver
    Tre = treasury
    TL = timelock
    Wrong = wrongpeer
    OtherCore = othercore
    Other = other
    MaxTime = 6
    AdminTTL = 2
    MinDelay = 1
    MaxDelay = 2
    Grace = 2
    MaxOps = 2
    Actors = {k1, k2}
    AllowAdmin = FALSE
    AllowWiring = FALSE
    AllowTimelock = TRUE
    AdminExpiry = "Code"
    WIRING_MODE = "Callback"
    TIMELOCK_SELF_ADMIN = FALSE
    WatchdogVigilant = FALSE
    START_HANDED_OVER = FALSE
    AdminSet = {core, timelock}
    Proposable = {resolver, treasury, wrongpeer}
    Mutation = "None"
CHECK_DEADLOCK FALSE

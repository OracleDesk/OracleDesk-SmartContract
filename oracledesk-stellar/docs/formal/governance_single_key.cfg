\* One compromised key = the timelock admin (k3). It SetRoles to become proposer
\* and canceller, schedules a config change nobody can cancel.
\* Expected: NoInstantPowerFromSingleKey VIOLATED (exit 12): residual trust in the admin.
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoInstantPowerFromSingleKey
CONSTANTS
    Keys = {k1, k2, k3}
    K1 = k1
    K2 = k2
    K3 = k3
    Core = core
    Res = resolver
    Tre = treasury
    TL = timelock
    Wrong = wrongpeer
    OtherCore = othercore
    Other = other
    MaxTime = 6
    AdminTTL = 2
    MinDelay = 1
    MaxDelay = 2
    Grace = 2
    MaxOps = 2
    Actors = {k3}
    AllowAdmin = FALSE
    AllowWiring = FALSE
    AllowTimelock = TRUE
    AdminExpiry = "Code"
    WIRING_MODE = "Callback"
    TIMELOCK_SELF_ADMIN = FALSE
    WatchdogVigilant = TRUE
    START_HANDED_OVER = FALSE
    AdminSet = {core, timelock}
    Proposable = {resolver, treasury, wrongpeer}
    Mutation = "None"
CHECK_DEADLOCK FALSE

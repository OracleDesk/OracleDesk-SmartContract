\* Wiring as deployed: market-core calls back into the peer. WiringLiveness is
\* VIOLATED (exit 13): the callback re-enters the resolver (Soroban InvalidAction).
SPECIFICATION LiveSpec
INVARIANTS
    TypeOK
    NoWiringToUnconsentingPeer
PROPERTIES
    WiringLiveness
CONSTANTS
    Keys = {k1, k2, k3}
    K1 = k1
    K2 = k2
    K3 = k3
    Core = core
    Res = resolver
    Tre = treasury
    TL = timelock
    Wrong = wrongpeer
    OtherCore = othercore
    Other = other
    MaxTime = 6
    AdminTTL = 2
    MinDelay = 1
    MaxDelay = 2
    Grace = 2
    MaxOps = 2
    Actors = {k1, k2, k3}
    AllowAdmin = FALSE
    AllowWiring = TRUE
    AllowTimelock = FALSE
    AdminExpiry = "Code"
    WIRING_MODE = "Callback"
    TIMELOCK_SELF_ADMIN = FALSE
    WatchdogVigilant = FALSE
    START_HANDED_OVER = FALSE
    AdminSet = {core, timelock}
    Proposable = {resolver}
    Mutation = "None"
CHECK_DEADLOCK FALSE

\* Two-step admin transfer against the ADR 0007 boundary (accept at expires_at).
\* Expected: NoExpiredAccept is VIOLATED today (TLC exit 12). See docs/formal/README.md.
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoUnauthorisedAdminChange
    NoExpiredAccept
CONSTANTS
    Keys = {k1, k2, k3}
    K1 = k1
    K2 = k2
    K3 = k3
    Core = core
    Res = resolver
    Tre = treasury
    TL = timelock
    Wrong = wrongpeer
    OtherCore = othercore
    Other = other
    MaxTime = 6
    AdminTTL = 2
    MinDelay = 1
    MaxDelay = 2
    Grace = 2
    MaxOps = 2
    Actors = {k1, k2, k3}
    AllowAdmin = TRUE
    AllowWiring = FALSE
    AllowTimelock = FALSE
    AdminExpiry = "Code"
    WIRING_MODE = "Callback"
    TIMELOCK_SELF_ADMIN = FALSE
    WatchdogVigilant = FALSE
    START_HANDED_OVER = FALSE
    AdminSet = {core, timelock}
    Proposable = {resolver, treasury, wrongpeer}
    Mutation = "None"
CHECK_DEADLOCK FALSE

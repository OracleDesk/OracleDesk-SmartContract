\* The timelock is its own admin (execute handles set_roles/accept_admin self-calls)
\* and the compromised key is the proposer: every admin power is delayed and
\* cancellable. NoInstantPowerFromSingleKey holds (exit 0).
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoInstantPowerFromSingleKey
CONSTANTS
    Keys = {k1, k2, k3}
    K1 = k1
    K2 = k2
    K3 = k3
    Core = core
    Res = resolver
    Tre = treasury
    TL = timelock
    Wrong = wrongpeer
    OtherCore = othercore
    Other = other
    MaxTime = 6
    AdminTTL = 2
    MinDelay = 1
    MaxDelay = 2
    Grace = 2
    MaxOps = 2
    Actors = {k1}
    AllowAdmin = FALSE
    AllowWiring = FALSE
    AllowTimelock = TRUE
    AdminExpiry = "Code"
    WIRING_MODE = "Callback"
    TIMELOCK_SELF_ADMIN = TRUE
    WatchdogVigilant = TRUE
    START_HANDED_OVER = TRUE
    AdminSet = {core, timelock}
    Proposable = {resolver, treasury, wrongpeer}
    Mutation = "None"
CHECK_DEADLOCK FALSE

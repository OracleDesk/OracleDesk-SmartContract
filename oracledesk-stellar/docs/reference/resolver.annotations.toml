# Curated caller/auth and storage metadata for resolver.
# Validated against packages/bindings/resolver/interface.json by scripts/gen-contract-docs/generate.mjs.

[functions.__constructor]
caller = "deployer (constructor)"

[functions.accept_admin]
caller = "pending admin (require_auth)"

[functions.accept_market_core_role]
caller = "anyone (permissionless)"
notes = "Completes authenticated market-core wiring by calling accept_resolver on configured market_core."

[functions.admin]
caller = "anyone (read-only)"

[functions.attest]
caller = "configured signer (require_auth)"

[functions.attest_with_evidence]
caller = "configured signer (require_auth)"

[functions.cancel_admin_transfer]
caller = "admin (require_auth)"

[functions.cancel_count]
caller = "anyone (read-only)"

[functions.cancel_proposal]
caller = "admin / guardian (require_auth)"

[functions.cancel_rotation]
caller = "admin (require_auth)"

[functions.claim_dispute_bond]
caller = "bond recipient (require_auth)"

[functions.create_committee]
caller = "admin (require_auth)"

[functions.current_round]
caller = "anyone (read-only)"

[functions.dispute]
caller = "challenger (require_auth)"

[functions.escalation_attest]
caller = "escalation signer (require_auth)"

[functions.evidence_at]
caller = "anyone (read-only)"

[functions.evidence_config]
caller = "anyone (read-only)"

[functions.evidence_count]
caller = "anyone (read-only)"

[functions.execute_rotation]
caller = "anyone (permissionless after timelock)"

[functions.expire_dispute]
caller = "anyone (permissionless after dispute window)"

[functions.expire_market]
caller = "anyone (permissionless after expiry)"

[functions.finalize_signers]

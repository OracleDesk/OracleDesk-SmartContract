[functions.get_committee]
caller = "anyone (read-only)"

[functions.guardian_options]
caller = "anyone (read-only)"

[functions.guardian_void_market]
caller = "admin / guardian (require_auth)"

[functions.market_core]
caller = "anyone (read-only)"

[functions.open_fallback]
caller = "anyone (permissionless when feed unavailable)"

[functions.pending_admin]
caller = "anyone (read-only)"

[functions.propose_admin]
caller = "admin (require_auth)"

[functions.propose_rotation]
caller = "admin (require_auth)"

[functions.register_committee_spec]
caller = "anyone (permissionless; hash commitment verified)"

[functions.register_disputable_spec]
caller = "anyone (permissionless; hash commitment verified)"

[functions.register_hybrid_spec]
caller = "anyone (permissionless; hash commitment verified)"

[functions.register_price_spec]
caller = "anyone (permissionless; hash commitment verified)"

[functions.register_signer_spec]
caller = "anyone (permissionless; hash commitment verified)"

[functions.register_spec_v2]
caller = "anyone (permissionless; salted V2 hash commitment verified)"

[functions.register_weighted_key_spec]
caller = "anyone (permissionless; hash commitment verified)"

[functions.resolution_deadline]
caller = "anyone (read-only)"

[functions.resolve_price]
caller = "anyone (permissionless after close_time)"

[functions.set_evidence_config]
caller = "admin (require_auth)"

[functions.settle_dispute]
caller = "anyone (permissionless after dispute resolution)"

[functions.snapshot]
caller = "anyone (read-only)"

[functions.snapshot_price]
caller = "anyone (permissionless)"

[functions.state]
caller = "anyone (read-only)"

[functions.submit_signatures]
caller = "anyone (verifies weighted Ed25519 signatures)"

[storage.Admin]

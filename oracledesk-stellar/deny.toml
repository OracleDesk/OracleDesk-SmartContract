# cargo-deny policy for OracleDesk (Issue #126).
# Run with:
#   cargo deny --manifest-path oracledesk-stellar/Cargo.toml check
#   cargo deny --manifest-path oracledesk-stellar/scripts/spec-hash/Cargo.toml check

[graph]
targets = [
  { triple = "wasm32v1-none" },
  { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
version = 2
# Documented exceptions must include an advisory ID, justification, and expiry:
# { id = "RUSTSEC-YYYY-NNNN", reason = "...; expires YYYY-MM-DD" }
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
  "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# soroban-sdk / soroban-env-host test dependencies pull duplicate transitive versions;
# warn rather than deny so upstream Soroban SDK releases do not block contributors.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

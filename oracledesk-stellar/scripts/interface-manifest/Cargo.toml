[workspace]

[package]
name = "interface-manifest"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
soroban-spec = "=27.0.6"
stellar-xdr = { version = "=27.0.0", features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
semver = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
soroban-sdk = { version = "=27.0.6", features = ["testutils"] }
